[workspace]
resolver = "3"
members = ["core", "desktop/src-tauri", "orchestrad"]

# Profiles are read from the workspace root only; a member's own profile is ignored.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
