[package]
name = "orchestra"
version = "0.1.0"
description = "Orchestra desktop: command center for coding agents"
authors = ["Nathan Curtis"]
license-file = "../../LICENSE"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orchestra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
orchestra-core = { path = "../../core" }
# The pairing QR is drawn as an SVG string in Rust; `svg` has no dependency of its own.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Lists this computer's addresses so the link can only be bound to one that exists.
if-addrs = "0.15"

# Credential Manager holds the host's private key on Windows (src/keyring.rs). Shell only:
# the core takes a `KeyProvider` and depends on no keyring.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
