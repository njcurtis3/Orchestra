[package]
name = "orchestrad"
version = "0.1.0"
description = "Orchestra headless host: the same engine and phone link as the desktop app, run as a Linux service"
authors = ["Nathan Curtis"]
license-file = "../LICENSE"
publish = false
edition = "2024"

[dependencies]
orchestra-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
