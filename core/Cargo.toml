[package]
name = "orchestra-core"
version = "0.1.0"
description = "Orchestra host engine: sessions, tasks, projects and notifications, with no UI shell"
authors = ["Nathan Curtis"]
license-file = "../LICENSE"
publish = false
edition = "2024"

[lib]
name = "orchestra_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
